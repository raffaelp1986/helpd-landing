<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>helpd — real people. real bills.</title>
  <meta name="description" content="Real people helping real people pay their bills. Coming soon to iOS and Android.">
  <meta property="og:title" content="helpd">
  <meta property="og:description" content="Real people helping real people pay their bills.">
  <meta property="og:image" content="hero.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0A0A0A;
      color: #F8F8F6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(10,10,10,0.9) 0%, transparent 100%);
    }

    .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #F8F8F6;
    }

    .wordmark span {
      color: #888888;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('hero.png');
      background-size: cover;
      background-position: center;
      opacity: 0.45;
    }

    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(10,10,10,0.3) 0%,
        rgba(10,10,10,0.1) 40%,
        rgba(10,10,10,0.7) 80%,
        rgba(10,10,10,1) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 24px;
      max-width: 680px;
    }

    .brand-logo {
      display: inline-block;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: #F8F8F6;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -2px;
      color: #F8F8F6;
      margin-bottom: 20px;
    }

    h1 em {
      font-style: normal;
      color: #BBBBBB;
    }

    .sub {
      font-size: 18px;
      font-weight: 400;
      line-height: 1.6;
      color: #888888;
      margin-bottom: 48px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Store Badges ── */
    .store-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .badge img {
      height: 44px;
      width: auto;
      opacity: 0.9;
      transition: opacity 0.2s;
      cursor: default;
    }

    .badge img:hover {
      opacity: 1;
    }

    /* ── Coming Soon pill ── */
    .coming-soon {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      color: #888888;
      border: 1px solid rgba(248,248,246,0.1);
      border-radius: 50px;
      padding: 6px 16px;
      letter-spacing: 0.5px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      font-size: 12px;
      color: #444444;
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      nav { padding: 20px 24px; }
      .store-badges { flex-direction: column; align-items: center; }
      .badge { width: 220px; justify-content: center; }
    }
  </style>
</head>
